<!DOCTYPE html>
<html lang="ru">
<head>

    <style>

            right: 0;

        .success-footer {

        /* ===== АДАПТИВ ===== */
        @media (max-width: 600px) {
            .payment-panel {
                grid-template-columns: 1fr;
                border-radius: 16px;
            }

            }
            .payment-left {

    </style>
</head>
<body>

    <!-- ===== ПАНЕЛЬ ОПЛАТЫ ===== -->
    <div class="payment-overlay">
        <div class="payment-panel">
            <div class="payment-left">

                    <div class="payment-total">Сумма <span id="totalAmount">249 ₽</span></div>
                </div>
            </div>
            <div class="payment-right">
                <!-- ВЫБОР ОПЛАТЫ -->
                <div class="payment-methods">
                    <div class="pm-btn active" data-method="sbp">
                        <span class="material-symbols-outlined icon-sm">payments</span> СБП
                    </div>
                    <div class="pm-btn" data-method="card">
                        <span class="material-symbols-outlined icon-sm">credit_card</span> Карта
                    </div>
                    <div class="pm-btn" data-method="other" id="otherMethodBtn">
                        <span class="material-symbols-outlined icon-sm">more_horiz</span> Другое
                    </div>
                </div>

                <!-- ВЫБОР СПОСОБА СВЯЗИ -->
                <div class="contact-methods" id="contactMethods">

                    <div class="cm-btn" data-contact="email">✉️ Почта</div>

                </div>

                <!-- ПОЛЕ ВВОДА -->
                <div class="payment-input" id="contactInputWrapper">
                    <span class="input-label" id="contactLabel">Введите номер телефона</span>
                    <input type="text" id="contactInput" placeholder="+7 (999) 999-99-99" />
                    <span class="input-hint" id="contactHint">Номер должен содержать 11 цифр</span>

                <!-- СООБЩЕНИЕ -->
                <div class="payment-input">
                    <span class="input-label">Сообщение (необязательно)</span>
                    <input type="text" id="messageInput" placeholder="Ваше сообщение..." />
                </div>

                <button class="btn-pay" id="payButton" disabled onclick="processPayment()">
                    Оплатить <span id="payAmount">249 ₽</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>

                <br>
                <a href="tariffs.html" class="btn-secondary dark">← Назад</a>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛКА "ДРУГОЕ" ===== -->
    <div class="other-overlay" id="otherOverlay">
        <div class="other-panel">
            <h3>Другие способы оплаты</h3>
            <button class="other-btn" onclick="selectOther('Криптовалюта (BTC/ETH/USDT)')">
                <span class="material-symbols-outlined">currency_bitcoin</span> Криптовалюта
            </button>
            <button class="other-btn" onclick="selectOther('Карты других стран (Visa/Mastercard)')">
                <span class="material-symbols-outlined">credit_card</span> Карты других стран
            </button>
            <button class="other-btn" onclick="selectOther('QIWI / ЮMoney')">
                <span class="material-symbols-outlined">account_balance_wallet</span> QIWI / ЮMoney
            </button>
            <button class="other-btn" onclick="selectOther('PayPal')">
                <span class="material-symbols-outlined">paypal</span> PayPal
            </button>
            <button class="other-btn" onclick="selectOther('Нал (при личной встрече)')">
                <span class="material-symbols-outlined">payments</span> Нал
            </button>
            <button class="other-close" onclick="closeOther()">✕ Закрыть</button>
        </div>
    </div>

    <!-- ===== УСПЕХ ===== -->
    <div class="success-overlay" id="successPanel">
        <div class="success-panel">
            <div class="success-icon">
                <span class="material-symbols-outlined">check_circle</span>
            </div>
            <h2>Оплачено</h2>
            <p>На вашу почту уже отправлен чек</p>
            <button class="success-footer" onclick="goToMain()">Супер!</button>
        </div>
    </div>

    <script>
        // ============================================================
        //   КОНФИГУРАЦИЯ TELEGRAM
        // ============================================================
        const BOT_TOKEN = '8451595343:AAFmxxaI9ltHhDAf4DJZ9SsU84nLZhpnKFc'; // ⚠️ ВСТАВЬ ТОКЕН ОТ @BotFather
        const CHAT_ID = '140403762';     // ⚠️ ВСТАВЬ СВОЙ CHAT ID
        const URL_API = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        // ============================================================
        //   ДАННЫЕ ТАРИФА
        // ============================================================
        let tariffData = { name: 'Лайт', price: 199 };

        // ============================================================
        //   ВЫБОР СПОСОБА СВЯЗИ
        // ============================================================
        let selectedContact = null;

        document.querySelectorAll('.cm-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.cm-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedContact = this.dataset.contact;

                const labels = {
                    phone: 'Введите номер телефона',
                    email: 'Введите почту',
                    telegram: 'Введите @username или ID'
                };
                const placeholders = {
                    phone: '+7 (999) 999-99-99',
                    email: 'your@email.com',
                    telegram: '@username или 123456789'
                };
                const hints = {
                    phone: 'Номер должен содержать 11 цифр',
                    email: 'Почта должна заканчиваться на .ru или .com',
                    telegram: 'Юзернейм с @ (без спецсимволов) или ID (только цифры)'
                };
                document.getElementById('contactLabel').textContent = labels[selectedContact];
                document.getElementById('contactInput').placeholder = placeholders[selectedContact];
                document.getElementById('contactHint').textContent = hints[selectedContact];
                document.getElementById('contactInput').disabled = false;
                document.getElementById('contactInput').value = '';
                document.getElementById('contactInput').focus();
                validateContactInput();
            });
        });

        // ============================================================
        //   ВАЛИДАЦИЯ
        // ============================================================
        function validateContactInput() {
            const input = document.getElementById('contactInput');
            const wrapper = document.getElementById('contactInputWrapper');
            const value = input.value.trim();
            const type = selectedContact;

            if (!type || !value) {
                wrapper.classList.remove('success', 'error');
                document.getElementById('payButton').disabled = true;
                return false;
            }

            let isValid = false;

            if (type === 'phone') {
                const digits = value.replace(/\D/g, '');
                isValid = digits.length === 11 && value.includes('+7') && !value.includes('_');
            } else if (type === 'email') {
                isValid = /^[^\s@]+@[^\s@]+\.(ru|com)$/.test(value);
            } else if (type === 'telegram') {
                const trimmed = value.trim();
                if (trimmed.startsWith('@')) {
                    isValid = /^@[a-zA-Z0-9_]+$/.test(trimmed) && !trimmed.endsWith('_');
                } else {
                    isValid = /^\d+$/.test(trimmed);
                }
            }

            wrapper.classList.remove('success', 'error');
            if (isValid) {
                wrapper.classList.add('success');
            } else {
                wrapper.classList.add('error');
            }

            document.getElementById('payButton').disabled = !isValid;
            return isValid;
        }

        // ============================================================
        //   МАСКА ТЕЛЕФОНА
        // ============================================================
        function maskPhone(input) {
            if (selectedContact !== 'phone') return;

            let value = input.value.replace(/\D/g, '');
            if (value.length === 0) {
                input.value = '+7';
                return;
            }
            if (value.length === 1 && value !== '7') {
                input.value = '+7';
                return;
            }
            let formatted = '+7';
            if (value.length > 1) {
                formatted += ' (' + value.substring(1, 4);
            }
            if (value.length >= 5) {
                formatted += ') ' + value.substring(4, 7);
            }
            if (value.length >= 8) {
                formatted += '-' + value.substring(7, 9);
            }
            if (value.length >= 10) {
                formatted += '-' + value.substring(9, 11);
            }
            input.value = formatted;
            validateContactInput();
        }

        // ============================================================
        //   ОБРАБОТКА ВВОДА
        // ============================================================
        document.getElementById('contactInput').addEventListener('input', function() {
            if (selectedContact === 'phone') {
                maskPhone(this);
            } else {
                validateContactInput();
            }
        });

        document.getElementById('contactInput').addEventListener('blur', validateContactInput);

        // ============================================================
        //   ВЫБОР ОПЛАТЫ
        // ============================================================
        let selectedPayment = 'sbp';

        document.querySelectorAll('.pm-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.pm-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedPayment = this.dataset.method;

                if (selectedPayment === 'other') {
                    document.getElementById('otherOverlay').classList.add('open');
                }
            });
        });

        // ============================================================
        //   МОДАЛКА "ДРУГОЕ"
        // ============================================================
        function selectOther(method) {
            closeOther();
            const otherBtn = document.querySelector('.pm-btn[data-method="other"]');
            otherBtn.innerHTML = `<span class="material-symbols-outlined icon-sm">check</span> ${method}`;
            otherBtn.classList.add('active');
            selectedPayment = method;
        }

        function closeOther() {
            document.getElementById('otherOverlay').classList.remove('open');
            const otherBtn = document.querySelector('.pm-btn[data-method="other"]');
            if (otherBtn.classList.contains('active') && selectedPayment === 'other') {
                otherBtn.classList.remove('active');
                document.querySelector('.pm-btn[data-method="sbp"]').classList.add('active');
                selectedPayment = 'sbp';
            }
        }

        document.getElementById('otherOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeOther();
        });

        // ============================================================
        //   ЗАГРУЗКА ТАРИФА
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const tariff = params.get('tariff');

            const tariffs = {
                light: { name: 'Лайт', price: 199 },
                optima: { name: 'Оптима', price: 299 },
                max: { name: 'Макс', price: 450 },
                music: { name: 'Музыка ван лав', price: 250 },
                video: { name: 'Сериалы и кино', price: 250 },
                gaming: { name: 'Игры', price: 300 },
                grandparents: { name: 'Бабушки и дедушки', price: 450 },
                parents: { name: 'Родители', price: 450 },
                kids: { name: 'Дети', price: 470 },
                travel: { name: 'Хеллоу фром Раша', price: 350 },
                perminute: { name: 'По минуте', price: 0 },
                custom: { name: 'Конструктор', price: 249 }
            };

            const data = tariffs[tariff] || tariffs.light;
            tariffData = data;
            document.getElementById('tariffName').innerHTML = `Тариф "${data.name}" — <span>${data.price} ₽</span>`;
            document.getElementById('totalAmount').textContent = (data.price + 50) + ' ₽';
            document.getElementById('payAmount').textContent = (data.price + 50) + ' ₽';
        });

        // ============================================================
        //   ГЕНЕРАЦИЯ ID
        // ============================================================
        function generateOrderId() {
            let id = '';
            for (let i = 0; i < 9; i++) {
                id += Math.floor(Math.random() * 10);
            }
            return id;
        }

        // ============================================================
        //   ОТПРАВКА В TELEGRAM
        // ============================================================
        function processPayment() {
            if (!selectedContact) {
                alert('Выберите способ связи!');
                return;
            }

            const contactValue = document.getElementById('contactInput').value.trim();
            if (!contactValue || !validateContactInput()) {
                alert('Введите корректные данные для связи!');
                return;
            }

            const messageText = document.getElementById('messageInput').value.trim() || 'Не указано';
            const orderId = generateOrderId();

            const contactLabels = {
                phone: '📱 Телефон',
                email: '✉️ Почта',
                telegram: '💬 Telegram'
            };

            let msg = `<b>📦 Новая заявка pltrs.mob!</b>\n\n`;
            msg += `🆔 <b>ID заявки:</b> ${orderId}\n`;
            msg += `📋 <b>Тариф:</b> ${tariffData.name}\n`;
            msg += `💰 <b>Сумма:</b> ${tariffData.price + 50} ₽\n`;
            msg += `💳 <b>Способ оплаты:</b> ${selectedPayment === 'sbp' ? 'СБП' : selectedPayment === 'card' ? 'Карта' : selectedPayment}\n`;
            msg += `📞 <b>Способ связи:</b> ${contactLabels[selectedContact] || selectedContact}\n`;
            msg += `📝 <b>Контакт:</b> ${contactValue}\n`;
            msg += `💬 <b>Сообщение:</b> ${messageText}\n\n`;
            msg += `🕐 ${new Date().toLocaleString('ru-RU')}`;

            fetch(URL_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    parse_mode: 'HTML',
                    text: msg
                })
            }).then(response => {
                if (response.ok) {
                    document.getElementById('successPanel').classList.add('open');
                } else {
                    alert('Ошибка отправки. Попробуйте ещё раз.');
                }
            }).catch(() => {
                alert('Ошибка соединения. Проверьте интернет.');
            });
        }

        // ============================================================
        //   КНОПКА "СУПЕР!"
        // ============================================================
        function goToMain() {
            window.location.href = 'index.html';
        }

        // ============================================================
        //   ТЕМА
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('pltrs_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        function loadTheme() {
            if (localStorage.getItem('pltrs_theme') === 'light') {
                document.body.classList.add('light-theme');
            }
        }

        document.addEventListener('DOMContentLoaded', loadTheme);

        // Enter для отправки
        document.getElementById('contactInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !document.getElementById('payButton').disabled) {
                processPayment();
            }
        });
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !document.getElementById('payButton').disabled) {
                processPayment();
            }
        });
    </script>

</body>
</html>
