<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pltrs.mob — Оплата</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Unbounded', sans-serif;
            font-weight: 500;
            font-size: 18px;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        body.light-theme {
            background: rgba(10, 10, 10, 0.9);
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-feature-settings: 'liga';
        }

        .icon-sm {
            font-size: 18px;
        }

        .lang-ru {
            font-family: 'Unbounded', sans-serif;
        }

        .lang-en {
            font-family: 'Syne', sans-serif;
        }

        .btn-primary {
            display: inline-block;
            padding: 12px 28px;
            background: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 30px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #ffffff;
            color: #000000;
        }

        body.light-theme .btn-primary {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        body.light-theme .btn-primary:hover {
            background: transparent;
            color: #ffffff;
        }

        .btn-secondary {
            display: inline-block;
            padding: 10px 24px;
            background: transparent;
            color: #000000;
            border: 2px solid #000000;
            border-radius: 30px;
            font-family: 'Syne', sans-serif;
            font-weight: 500;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: #000000;
            color: #ffffff;
        }

        body.light-theme .btn-secondary {
            color: #ffffff;
            border-color: #ffffff;
        }

        body.light-theme .btn-secondary:hover {
            background: #ffffff;
            color: #000000;
        }

        .payment-overlay {
            width: 100%;
            max-width: 700px;
        }

        .payment-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
        }

        body.light-theme .payment-panel {
            background: #1a1a1a;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .payment-left {
            padding: 30px;
            background: #ffffff;
        }

        body.light-theme .payment-left {
            background: #1a1a1a;
            color: #eeeeee;
        }

        .payment-left .payment-item {
            font-size: 16px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-family: 'Unbounded', sans-serif;
        }

        body.light-theme .payment-left .payment-item {
            border-bottom-color: #333333;
        }

        .payment-left .payment-item span {
            float: right;
            font-weight: 600;
            font-family: 'Syne', sans-serif;
        }

        .payment-total {
            font-size: 22px;
            font-weight: 900;
            padding-top: 16px;
            margin-top: 8px;
            border-top: 2px solid #000000;
            font-family: 'Syne', sans-serif;
        }

        body.light-theme .payment-total {
            border-top-color: #ffffff;
            color: #ffffff;
        }

        .payment-total span {
            float: right;
        }

        .payment-right {
            padding: 30px;
            background: #000000;
            color: #ffffff;
        }

        body.light-theme .payment-right {
            background: #0a0a0a;
        }

        .payment-methods {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .payment-methods span {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Unbounded', sans-serif;
        }

        .payment-methods span:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .payment-email {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            font-family: 'Unbounded', sans-serif;
        }

        .edit-icon {
            margin-left: auto;
            opacity: 0.5;
            cursor: pointer;
        }

        .payment-blank {
            background: #ffffff;
            border-radius: 12px;
            padding: 0 14px;
            margin-bottom: 12px;
            transition: background 0.3s;
        }

        body.light-theme .payment-blank {
            background: #333333;
        }

        .payment-blank input {
            width: 100%;
            padding: 12px 0;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            font-family: 'Unbounded', sans-serif;
        }

        body.light-theme .payment-blank input {
            color: #ffffff;
        }

        body.light-theme .payment-blank input::placeholder {
            color: #888888;
        }

        .payment-agree {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            opacity: 0.7;
            margin: 12px 0;
            font-family: 'Unbounded', sans-serif;
        }

        .btn-pay {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 30px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-pay:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-pay:hover:not(:disabled) {
            transform: scale(1.02);
        }

        body.light-theme .btn-pay {
            background: #ffffff;
            color: #000000;
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .success-panel {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            animation: slideUp 0.5s ease;
        }

        body.light-theme .success-panel {
            background: #1a1a1a;
            color: #eeeeee;
        }

        .success-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
            background: rgba(0, 200, 100, 0.15);
            border-radius: 50%;
            margin-bottom: 16px;
        }

        .success-icon .material-symbols-outlined {
            font-size: 48px;
            color: #22c55e;
        }

        .success-panel h2 {
            font-size: 28px;
            margin-bottom: 8px;
            font-family: 'Syne', sans-serif;
        }

        .success-panel p {
            font-size: 16px;
            opacity: 0.6;
            margin-bottom: 24px;
            font-family: 'Unbounded', sans-serif;
        }

        .success-footer {
            display: inline-block;
            background: #000000;
            color: #ffffff;
            padding: 12px 40px;
            border-radius: 30px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .success-footer:hover {
            transform: scale(1.05);
        }

        body.light-theme .success-footer {
            background: #ffffff;
            color: #000000;
        }

        @media (max-width: 600px) {
            .payment-panel {
                grid-template-columns: 1fr;
                border-radius: 16px;
            }
            .payment-right {
                padding: 20px;
            }
            .payment-left {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="payment-overlay">
        <div class="payment-panel">
            <div class="payment-left">
                <div class="payment-summary">
                    <div class="payment-item">Сим-карта — <span>50 ₽</span></div>
                    <div class="payment-item" id="tariffName">Тариф "Лайт" — <span>199 ₽</span></div>
                    <div class="payment-total">Сумма <span id="totalAmount">249 ₽</span></div>
                </div>
            </div>
            <div class="payment-right">
                <div class="payment-methods">
                    <span><span class="material-symbols-outlined icon-sm">payments</span> СБП</span>
                    <span><span class="material-symbols-outlined icon-sm">credit_card</span> Карта</span>
                    <span><span class="material-symbols-outlined icon-sm">more_horiz</span> Другое</span>
                </div>
                <div class="payment-email">
                    <span class="material-symbols-outlined">mail</span>
                    <span>ployyka@icloud.com</span>
                    <span class="edit-icon"><span class="material-symbols-outlined">edit</span></span>
                </div>
                <div class="payment-blank">
                    <input type="text" placeholder="Ваше сообщение (необязательно)" id="messageInput" onfocus="this.parentElement.style.background='#eee'" onblur="if(!this.value) this.parentElement.style.background='white'" />
                </div>
                <label class="payment-agree">
                    <input type="checkbox" id="agreeCheck" onchange="togglePayButton()" /> Согласен с условиями
                </label>
                <button class="btn-pay" id="payButton" disabled onclick="processPayment()">
                    Оплатить <span id="payAmount">249 ₽</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
                <br>
                <a href="tariffs.html" class="btn-secondary dark">← Назад</a>
            </div>
        </div>
    </div>

    <div id="successPanel" style="display:none;" class="success-overlay">
        <div class="success-panel">
            <div class="success-icon">
                <span class="material-symbols-outlined">check_circle</span>
            </div>
            <h2>Оплачено</h2>
            <p>На вашу почту уже отправлен чек</p>
            <button class="success-footer" onclick="goToMain()">Супер!</button>
        </div>
    </div>

    <script>
        function goToMain() {
            window.location.href = 'index.html';
        }

        function togglePayButton() {
            const agree = document.getElementById('agreeCheck').checked;
            document.getElementById('payButton').disabled = !agree;
        }

        function processPayment() {
            document.querySelector('.payment-overlay').style.display = 'none';
            document.getElementById('successPanel').style.display = 'flex';
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('pltrs_theme', document.body.classList.contains('light-theme'));
        }

        function loadTheme() {
            const isDark = localStorage.getItem('pltrs_theme') === 'true';
            if (isDark) {
                document.body.classList.add('light-theme');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadTheme();

            const params = new URLSearchParams(window.location.search);
            const tariff = params.get('tariff');

            const tariffs = {
                light: { name: 'Лайт', price: 199 },
                optima: { name: 'Оптима', price: 299 },
                max: { name: 'Макс', price: 450 },
                music: { name: 'Музыка ван лав', price: 250 },
                video: { name: 'Сериалы и кино', price: 250 },
                gaming: { name: 'Игры', price: 300 },
                grandparents: { name: 'Бабушки и дедушки', price: 450 },
                parents: { name: 'Родители', price: 450 },
                kids: { name: 'Дети', price: 470 },
                travel: { name: 'Хеллоу фром Раша', price: 350 },
                perminute: { name: 'По минуте', price: 0 },
                custom: { name: 'Конструктор', price: 249 }
            };

            const data = tariffs[tariff] || tariffs.light;
            document.getElementById('tariffName').innerHTML = `Тариф "${data.name}" — <span>${data.price} ₽</span>`;
            document.getElementById('totalAmount').textContent = (data.price + 50) + ' ₽';
            document.getElementById('payAmount').textContent = (data.price + 50) + ' ₽';
        });
    </script>

</body>
</html>
